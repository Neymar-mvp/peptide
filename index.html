<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>US Peptide Catalog — PeptideExpress</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121a30; --panel2:#16203b; --line:#243150;
    --txt:#e8edf7; --muted:#9fb0d0; --accent:#37d0a6; --accent2:#5b8cff;
    --gold:#f4c95d; --tag:#1d294a; --danger:#ff6b6b; --cartbg:#0e1426;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
       background:radial-gradient(1200px 600px at 80% -10%,#16203b 0%,var(--bg) 55%);color:var(--txt);line-height:1.5;min-height:100vh}
  a{color:var(--accent2)}
  header{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);
         background:linear-gradient(180deg,rgba(11,16,32,.97),rgba(11,16,32,.84));border-bottom:1px solid var(--line)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 6px}
  .brand{font-weight:800;font-size:21px;line-height:1.1}
  .brand .x{color:var(--accent)}
  .slogan{color:var(--gold);font-size:11.5px;font-weight:600;letter-spacing:.2px;margin-top:2px}
  .topright{display:flex;align-items:center;gap:10px}
  select.lang{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;outline:none}
  .cartbtn{display:none}
  .cartfab{position:fixed;right:18px;bottom:18px;z-index:35;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121f;font-size:26px;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;transition:.15s}
  .cartfab:hover{transform:scale(1.06)}
  .cartfab .badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:800}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0 12px}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .search input{border:0;background:transparent;color:var(--txt);outline:none;width:100%;font-size:15px}
  .count{color:var(--muted);font-size:13px;white-space:nowrap}
  nav.pills{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 12px}
  .pill{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;transition:.15s}
  .pill:hover{color:var(--txt);border-color:var(--accent2)}
  .pill.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121f;border-color:transparent}
  main{padding:8px 0 60px}
  .cat{margin:24px 0 8px;display:flex;align-items:center;gap:10px}
  .cat h2{font-size:18px;margin:0;font-weight:800}
  .cat .bar{flex:1;height:1px;background:var(--line)}
  .cat .num{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:.15s}
  .card:hover{transform:translateY(-2px);border-color:var(--accent2);box-shadow:0 8px 26px rgba(0,0,0,.35)}
  .name{font-weight:700;font-size:15px}
  .spec{color:var(--muted);font-size:13px}
  .desc{color:#c4d0e8;font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:54px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
  .price{font-weight:800;font-size:17px;color:var(--gold)}
  .price small{display:block;color:var(--muted);font-weight:500;font-size:10.5px}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.liq{color:#7fd1ff;border-color:#244a66}
  .badge.oos{color:var(--danger);border-color:#5a2730;background:#2a151a}
  .row{display:flex;gap:8px;margin-top:4px}
  .btn{flex:1;border:1px solid var(--line);background:var(--tag);color:var(--txt);border-radius:10px;padding:8px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent2)}
  .btn.add{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121f;border:0}
  .btn.add:disabled{filter:grayscale(.7);opacity:.6;cursor:not-allowed}
  .btn.ghost{background:transparent}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding:22px 0 40px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}

  /* Cart drawer */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
  .overlay.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,92vw);background:var(--cartbg);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer header{position:static;background:transparent;border:0;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .drawer h3{margin:0;font-size:17px}
  .xbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px}
  .citems{flex:1;overflow-y:auto;padding:10px 14px}
  .citem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .citem .ci-name{font-weight:700;font-size:13.5px}
  .citem .ci-spec{color:var(--muted);font-size:12px}
  .citem .ci-price{color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap}
  .stepper{display:flex;align-items:center;gap:6px;margin-top:6px}
  .stepper button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-size:15px;line-height:1}
  .stepper .q{min-width:22px;text-align:center;font-weight:700}
  .ci-rm{margin-left:auto;background:transparent;border:0;color:var(--danger);cursor:pointer;font-size:12px}
  .cfoot{padding:14px 18px;border-top:1px solid var(--line)}
  .ctot{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
  .ctot.grand{font-size:17px;font-weight:800;color:var(--gold);margin-top:6px}
  .checkout{width:100%;margin-top:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#06121f;font-weight:800;border-radius:10px;padding:11px;cursor:pointer;font-size:14px}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
  .modal.show{display:flex}
  .mbox{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:20px;max-height:86vh;overflow-y:auto}
  .mbox h3{margin:0 0 2px;font-size:19px}
  .mbox .mspec{color:var(--muted);font-size:13px;margin-bottom:10px}
  .mbox .mdesc{font-size:14px;line-height:1.6;color:#d6e0f2}
  .mbox .mnote{margin-top:12px;font-size:12px;color:var(--muted);border-left:3px solid var(--accent);padding:8px 10px;background:rgba(55,208,166,.07);border-radius:0 8px 8px 0}
  .mbox .mfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
  .mbox .mprice{font-weight:800;font-size:18px;color:var(--gold)}
</style>
</head>

  </div>
</div>

 ["w-tirz-5","Tirzepatide","weight","5mg*10vials",29,"lyo",0,"Tirzepatide is a synthetic 39-amino-acid dual agonist of the GIP and GLP-1 receptors, engineered with a C20 fatty-diacid moiety that extends its half-life to about five days. By activating two incretin pathways simultaneously it is used to investigate synergistic effects on insulin secretion, glucagon regulation, gastric emptying and central appetite control. Preclinical and clinical research has made it a benchmark compound in metabolic and body-composition studies. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline using gentle swirling; avoid vigorous shaking or foaming. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","替尔泊肽（Tirzepatide）是人工合成的 39 氨基酸双重 GIP/GLP-1 受体激动剂，带有 C20 脂肪酸二酸侧链，可将半衰期延长至约五天。通过同时激活两条肠促胰岛素通路，常用于研究胰岛素分泌、胰高血糖素调节、胃排空及中枢食欲控制的协同效应。临床前与临床研究使其成为代谢与体成分研究的标杆化合物。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶，避免剧烈振荡起泡；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["w-reta-5","Retatrutide","weight","5mg*10vials",45,"lyo",0,"Retatrutide is a synthetic triple agonist targeting the GLP-1, GIP and glucagon receptors — often described as a 'triple-G' peptide. Its balanced activity across three metabolic pathways is used in research to study additive effects on energy expenditure, lipid metabolism, appetite suppression and glycaemic control. It is one of the most actively investigated next-generation metabolic peptides. Supplied as a sterile lyophilized powder, ≥98% HPLC purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently and do not vortex. Store lyophilized powder at −20 °C; reconstituted solution at 2–8 °C for short-term use, protected from light. For research use only. Not for human or animal consumption.","瑞他鲁肽（Retatrutide）是同时靶向 GLP-1、GIP 与胰高血糖素受体的三重激动剂，常被称为“triple-G”肽。它在三条代谢通路上活性均衡，研究用于能量消耗、脂质代谢、食欲抑制与血糖控制的叠加效应。是目前研究最活跃的下一代代谢肽之一。产品为无菌冻干粉末，HPLC 纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水复溶，轻柔旋转、切勿涡旋；冻干粉 −20 °C 保存，复溶液 2–8 °C 避光短期保存。仅供研究使用，不可用于人或动物摄入。"],

 ["w-cagri-5","Cagrilintide","weight","5mg*10vials",95,"lyo",0,"Cagrilintide is a long-acting analogue of human amylin, a 37-amino-acid satiety hormone co-secreted with insulin by pancreatic beta cells. It is used in research to study amylin-receptor signalling, delayed gastric emptying, satiety pathways and its complementary role alongside GLP-1 agonists in metabolic control. Its extended half-life makes it a useful tool in chronic metabolic studies. Supplied as sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","卡格列肽（Cagrilintide）是人胰淀素的长效类似物。胰淀素是由胰岛 β 细胞与胰岛素共同分泌的 37 氨基酸饱腹激素。研究用于胰淀素受体信号、胃排空延迟、饱腹通路，以及与 GLP-1 激动剂在代谢控制中的互补作用。延长的半衰期使其适用于慢性代谢研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["w-aod-5","AOD9604","weight","5mg*10vials",89,"lyo",0,"AOD9604 is a modified fragment of human growth hormone (hGH), corresponding to residues 176–191 of the hGH C-terminal region with an added N-terminal tyrosine. Unlike full-length hGH it does not stimulate IGF-1 or affect blood glucose in research models, and it has been studied for its effects on lipolysis and fat metabolism in adipose tissue. It is commonly used in metabolic and obesity-related laboratory research. Supplied as sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","AOD9604 是人生长激素（hGH）的修饰片段，对应 hGH C 端第 176–191 位残基，并在 N 端加了一个酪氨酸。与全长 hGH 不同，研究模型中它不刺激 IGF-1，也不影响血糖，主要被研究对脂肪组织脂解与脂肪代谢的作用，常用于代谢与肥胖相关实验室研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["w-amq-5","5-Amino-1MQ","weight","5mg*10vials",42,"lyo",0,"5-Amino-1-methylquinolinium (5-Amino-1MQ) is a small-molecule inhibitor of nicotinamide N-methyltransferase (NNMT). By blocking NNMT it raises intracellular NAD+ and SAM levels, and has been investigated in research on adipocyte metabolism, energy expenditure and metabolic regulation. It is supplied as a sterile lyophilized powder of ≥98% purity in 10-vial boxes. Reconstitute with bacteriostatic water or an appropriate solvent, swirl gently and avoid vortexing. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","5-Amino-1MQ（5-氨基-1-甲基喹啉鎓）是烟酰胺 N-甲基转移酶（NNMT）的小分子抑制剂。通过抑制 NNMT 提高细胞内 NAD+ 与 SAM 水平，被用于脂肪细胞代谢、能量消耗与代谢调控研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或适当溶剂轻柔旋转复溶，避免涡旋；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["w-amq-50","5-Amino-1MQ","weight","50mg*10vials",101,"lyo",0,"5-Amino-1-methylquinolinium (5-Amino-1MQ) is a small-molecule inhibitor of nicotinamide N-methyltransferase (NNMT). By blocking NNMT it raises intracellular NAD+ and SAM levels, and has been investigated in research on adipocyte metabolism, energy expenditure and metabolic regulation. It is supplied as a sterile lyophilized powder of ≥98% purity in 10-vial boxes. Reconstitute with bacteriostatic water or an appropriate solvent, swirl gently and avoid vortexing. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","5-Amino-1MQ（5-氨基-1-甲基喹啉鎓）是烟酰胺 N-甲基转移酶（NNMT）的小分子抑制剂。通过抑制 NNMT 提高细胞内 NAD+ 与 SAM 水平，被用于脂肪细胞代谢、能量消耗与代谢调控研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或适当溶剂轻柔旋转复溶，避免涡旋；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],
 ["w-lemon","Lemon Bottle","weight","10ml*10vials",42,"liq",0,"Lemon Bottle is a proprietary lipolytic solution developed for localized fat-reduction research. Its formula combines riboflavin (vitamin B2), lecithin (phosphatidylcholine) and bromelain, a pineapple-derived enzyme blend, and is typically used in topical or intradermal laboratory studies of adipocyte lipolysis and fat metabolism. It is supplied as a ready-to-use sterile liquid in 10-vial boxes. Store refrigerated at 2–8 °C, protected from light, and do not freeze. For research use only. Not for human or animal consumption.","Lemon Bottle 是专为局部减脂研究开发的溶脂溶液，配方结合核黄素（维生素 B2）、卵磷脂（磷脂酰胆碱）与菠萝来源的菠萝蛋白酶，常用于脂肪细胞脂解与脂肪代谢的局部或皮内实验室研究。产品为即用型无菌液体，每盒 10 瓶。2–8 °C 冷藏避光保存，切勿冷冻。仅供研究使用，不可用于人或动物摄入。"],
 ["w-lipo","Lipo-c","weight","10ml*10vials",105,"liq",0,"Lipo-c is a lipotropic injectable blend used in metabolic research. It typically combines methionine, inositol and choline (the 'MIC' triad), which are studied for their roles in hepatic lipid transport and fat metabolism, together with vitamin B12 and often L-carnitine. The formulation is used to investigate lipid mobilisation and liver-metabolism pathways in laboratory settings. Supplied as a sterile liquid in 10-vial boxes. Store at 2–8 °C, protected from light; do not freeze. For research use only. Not for human or animal consumption.","Lipo-c 是用于代谢研究的溶脂注射复合液，通常由蛋氨酸、肌醇与胆碱（“MIC”组合，研究其在肝脏脂质转运与脂肪代谢中的作用）以及维生素 B12，常含左旋肉碱组成。用于实验室研究脂质动员与肝脏代谢通路。产品为无菌液体，每盒 10 瓶。2–8 °C 避光保存，切勿冷冻。仅供研究使用，不可用于人或动物摄入。"],
 ["w-mic","MICLipo C with B12","weight","10mg*10vials",98,"lyo",0,"MICLipo C with B12 is a lyophilized lipotropic blend of methionine, inositol and choline combined with vitamin B12, prepared for metabolic research. Methionine, inositol and choline are studied for their involvement in hepatic lipid export and phospholipid synthesis, while B12 supports methylation and energy metabolism. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","MICLipo C with B12 是蛋氨酸、肌醇与胆碱并含维生素 B12 的冻干溶脂复合配方，用于代谢研究。蛋氨酸、肌醇与胆碱被研究参与肝脏脂质输出与磷脂合成，B12 支持甲基化与能量代谢。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["r-bpc-5","BPC 157","recovery","5mg*10vials",38,"lyo",0,"BPC-157 (Body Protection Compound 157) is a synthetic 15-amino-acid pentadecapeptide derived from a fragment of human gastric juice protein. In research models it has been studied for its effects on tissue repair, angiogenesis, fibroblast activity and gastrointestinal protection through pathways involving VEGFR2 and nitric-oxide signalling. It is one of the most widely investigated repair peptides in preclinical literature. Supplied as a sterile lyophilized powder, ≥98% HPLC purity, 10 vials per box. Reconstitute with bacteriostatic water, swirl gently; a slight cloudiness can be normal. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","BPC-157（Body Protection Compound 157）是源自人胃液蛋白片段的合成十五肽。研究模型中，它通过涉及 VEGFR2 与一氧化氮信号的通路，被研究其对组织修复、血管生成、成纤维细胞活性与胃肠道保护的作用，是临床前文献中研究最广泛的修复肽之一。产品为无菌冻干粉末，HPLC 纯度 ≥98%，每盒 10 瓶。用抑菌水轻柔旋转复溶，轻微浑浊属正常；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["r-tb-5","TB500","recovery","5mg*10vials",62,"lyo",0,"TB-500 is a synthetic fragment of thymosin beta-4 (Tβ4), an actin-binding protein found in most human cells. The fragment is studied for its roles in cell migration, angiogenesis, blood-vessel formation and tissue repair, and is commonly used alongside BPC-157 in recovery research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently and avoid foaming. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","TB-500 是胸腺素 β-4（Tβ4）的合成片段。Tβ4 是广泛存在于人体细胞中的肌动蛋白结合蛋白。该片段被研究参与细胞迁移、血管生成、血管形成与组织修复，常与 BPC-157 一起用于恢复研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶，避免起泡；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["r-ghk-50","GHK-Cu","recovery","50mg*10vials",23,"lyo",0,"GHK-Cu is a naturally occurring copper-binding tripeptide (glycyl-L-histidyl-L-lysine) complexed with a copper(II) ion. Found in human plasma, saliva and urine, it is studied for its roles in collagen synthesis, antioxidant activity, tissue remodelling and skin-repair signalling. It is widely used in dermatological and wound-healing research. Supplied as a sterile lyophilized blue powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","GHK-Cu 是天然存在的结合铜三肽（甘氨酰-组氨酰-赖氨酸）与铜(II) 离子的复合物，存在于人血浆、唾液与尿液中，被研究参与胶原合成、抗氧化、组织重塑与皮肤修复信号，广泛用于皮肤科与创伤愈合研究。产品为无菌冻干蓝色粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["r-ser-5","Sermorelin","recovery","5mg*10vials",68,"lyo",0,"Sermorelin is a synthetic 29-amino-acid analogue of growth-hormone-releasing hormone (GHRH 1-29), the shortest fully active fragment of endogenous GHRH. It binds GHRH receptors on the pituitary and is used in research on growth-hormone release, the GH/IGF-1 axis and endocrine regulation. Its relatively short half-life makes it a useful tool for pulsatile-release studies. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","舍莫瑞林（Sermorelin）是生长激素释放激素（GHRH 1-29）的合成 29 氨基酸类似物，为内源 GHRH 最短的完全活性片段。它结合垂体 GHRH 受体，用于生长激素释放、GH/IGF-1 轴与内分泌调节研究。较短的半衰期使其适用于脉冲式释放研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["r-tesa-2","Tesamorelin","recovery","2mg*10vials",50,"lyo",0,"Tesamorelin is a synthetic analogue of GHRH consisting of the 44-amino-acid human GHRH with a trans-3-hexenoyl modification that increases stability. It is used in research on growth-hormone secretion, the GH/IGF-1 axis, visceral adipose tissue and lipid metabolism, and is among the most studied GHRH analogues in body-composition research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently and avoid vortexing. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","替莫瑞林（Tesamorelin）是人 GHRH 的合成类似物，由 44 个氨基酸组成并带反式-3-己烯酰修饰以增强稳定性。用于生长激素分泌、GH/IGF-1 轴、内脏脂肪与脂质代谢研究，是体成分研究中研究最充分的 GHRH 类似物之一。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶，避免涡旋；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["r-igf-100","IGF-1 LR3","recovery","100mcg*10vials",57,"lyo",0,"IGF-1 LR3 (Long Arg3 Insulin-like Growth Factor-1) is a recombinant analogue of human IGF-1 with an N-terminal extension and an arginine substitution at position 3. These changes reduce binding to IGF-binding proteins and extend its half-life, making it a widely used tool in research on cell growth, protein synthesis, glucose metabolism and the GH/IGF-1 axis. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","IGF-1 LR3（Long Arg3 类胰岛素样生长因子-1）是人 IGF-1 的重组类似物，带 N 端延长并在第 3 位点以精氨酸替代，可降低与 IGF 结合蛋白的结合并延长半衰期，广泛用于细胞生长、蛋白合成、葡萄糖代谢与 GH/IGF-1 轴研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["b-epi-10","Epithalon","beauty","10mg*10vials",42,"lyo",0,"Epithalon (Epitalon) is a synthetic tetrapeptide (Ala-Glu-Asp-Gly) based on the natural pineal peptide epithalamin. It is studied for its effects on telomerase activity, telomere length, pineal regulation and cellular ageing, and is a common tool in longevity and gerontology research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","Epithalon（Epitalon）是基于松果体天然肽 epithalamin 的合成四肽（Ala-Glu-Asp-Gly），被研究对端粒酶活性、端粒长度、松果体调节与细胞衰老的作用，是抗衰老与老年学研究的常用工具。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["b-fox-2","FOXO4-DRI","beauty","2mg*10vials",89,"lyo",0,"FOXO4-DRI is a synthetic D-retro-inverso peptide designed to disrupt the FOXO4–p53 protein interaction. In senescent cells this interaction is linked to apoptosis resistance; the peptide is therefore studied as a senolytic tool in cellular-senescence, ageing and tissue-regeneration research. Its D-amino-acid backbone confers resistance to proteases. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or an appropriate solvent, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","FOXO4-DRI 是人工合成的 D 型逆反（retro-inverso）肽，用于干扰 FOXO4 与 p53 的蛋白互作。在衰老细胞中该互作与凋亡抵抗相关，因此被作为衰老细胞清除（senolytic）工具，用于细胞衰老、衰老与组织再生研究；D 型氨基酸骨架使其抗蛋白酶降解。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或适当溶剂轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["b-snap-10","Snap-8","beauty","10mg*10vials",67,"lyo",0,"Snap-8 (acetyl octapeptide-3 / SNAP-8) is a synthetic eight-amino-acid peptide derived from the N-terminal region of SNAP-25. It is studied for its ability to modulate SNARE-complex formation and neuromuscular signalling, and is widely used in cosmetic research on expression-line and wrinkle reduction. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","Snap-8（乙酰八肽-3 / SNAP-8）是源自 SNAP-25 N 端区域的合成八肽，被研究可调节 SNARE 复合物形成与神经肌肉信号，广泛用于表情纹与抗皱美容研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],
 ["b-ss-10","SS-31","beauty","10mg*10vials",79,"lyo",0,"SS-31 (Elamipretide) is a synthetic mitochondria-targeting tetrapeptide that concentrates in the inner mitochondrial membrane and binds cardiolipin. It is studied for its effects on mitochondrial bioenergetics, reactive-oxygen-species production and cellular energy metabolism, making it a key tool in mitochondrial and ageing research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","SS-31（Elamipretide）是靶向线粒体的合成四肽，富集于线粒体内膜并结合心磷脂，被研究对线粒体生物能量学、活性氧生成与细胞能量代谢的作用，是线粒体与衰老研究的关键工具。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["b-glu-600","Glutathione","beauty","600mg*10vials",45,"lyo",0,"Glutathione (GSH) is a tripeptide of glutamate, cysteine and glycine, and the principal intracellular antioxidant in mammalian cells. It participates in redox balance, detoxification and enzyme regulation, and is studied in oxidative-stress, liver and antioxidant research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or sterile water, swirl gently; prepare fresh as aqueous solutions are relatively unstable. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","谷胱甘肽（GSH）是由谷氨酸、半胱氨酸和甘氨酸组成的三肽，是哺乳动物细胞内主要的抗氧化剂，参与氧化还原平衡、解毒与酶调控，用于氧化应激、肝脏与抗氧化研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或无菌水轻柔旋转复溶；水溶液相对不稳定，建议新鲜配制；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["b-nad-100","NAD+","beauty","100mg*10vials",32,"lyo",0,"NAD+ (nicotinamide adenine dinucleotide) is a central coenzyme in cellular redox reactions and a substrate for sirtuins, PARPs and CD38. It is studied in energy metabolism, mitochondrial function, DNA repair and ageing research, where declining NAD+ levels are linked to metabolic and age-related changes. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or sterile water, swirl gently; prepare fresh where possible. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","NAD+（烟酰胺腺嘌呤二核苷酸）是细胞氧化还原反应的核心辅酶，也是 sirtuins、PARP 与 CD38 的底物，用于能量代谢、线粒体功能、DNA 修复与衰老研究——NAD+ 水平下降与代谢及年龄相关变化相关。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或无菌水轻柔旋转复溶，尽量新鲜配制；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["b-glow","GLOW","beauty","70mg*10vials",229,"lyo",0,"GLOW is a research blend combining BPC-157, GHK-Cu and TB-500 in a single lyophilized vial. The three peptides are studied together for complementary roles in tissue repair, angiogenesis, collagen synthesis and skin remodelling, and the blend is used in recovery and aesthetic research protocols. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","GLOW 是将 BPC-157、GHK-Cu 与 TB-500 组合于单瓶冻干粉中的研究复合配方。三种肽被共同研究其在组织修复、血管生成、胶原合成与皮肤重塑中的互补作用，用于恢复与美学研究方案。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],
 ["b-klow","Klow","beauty","80mg*10vials",229,"lyo",0,"Klow is a research blend combining BPC-157, GHK-Cu, TB-500 and KPV in one lyophilized vial. The combination brings together tissue-repair peptides (BPC-157, TB-500, GHK-Cu) with the anti-inflammatory tripeptide KPV, and is studied in recovery, skin and inflammation research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","Klow 是将 BPC-157、GHK-Cu、TB-500 与 KPV 组合于单瓶冻干粉中的研究复合配方，将组织修复肽（BPC-157、TB-500、GHK-Cu）与抗炎三肽 KPV 结合，用于恢复、皮肤与炎症研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["n-dsip-5","DSIP","neuro","5mg*10vials",55,"lyo",0,"DSIP (Delta Sleep-Inducing Peptide) is a naturally occurring nonapeptide originally isolated from rabbit cerebral venous blood. It is studied for its effects on sleep architecture, slow-wave sleep, stress response and neuroendocrine regulation, and is a widely used tool in sleep and stress research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","DSIP（δ-睡眠诱导肽）是天然存在的九肽，最初从兔脑静脉血中分离，被研究对睡眠结构、慢波睡眠、应激反应与神经内分泌调节的作用，是睡眠与应激研究的常用工具。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["n-sel-5","Selank","neuro","5mg*10vials",45,"lyo",0,"Selank is a synthetic heptapeptide analogue of the endogenous immunomodulator tuftsin, with the sequence Thr-Lys-Pro-Arg-Pro-Gly-Pro. It is studied for anxiolytic-like activity, cognitive function, GABAergic signalling and immune modulation, and is used in neuropharmacology and behavioural research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","Selank 是内源免疫调节因子 tuftsin 的合成七肽类似物，序列为 Thr-Lys-Pro-Arg-Pro-Gly-Pro，被研究具有抗焦虑样活性、认知功能、GABA 能信号与免疫调节作用，用于神经药理与行为研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["n-oxy-2","Oxytocin","neuro","2mg*10vials",28,"lyo",0,"Oxytocin is a nine-amino-acid neuropeptide hormone produced in the hypothalamus and released by the posterior pituitary. It is studied for its roles in social behaviour, bonding, stress modulation and smooth-muscle activity, and is a key tool in behavioural and neuroendocrine research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light; use promptly. For research use only. Not for human or animal consumption.","催产素（Oxytocin）是由下丘脑产生、垂体后叶释放的九肽神经激素，被研究在社交行为、依恋、应激调节与平滑肌活动中的作用，是行为与神经内分泌研究的关键工具。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存并尽快使用。仅供研究使用，不可用于人或动物摄入。"],

 ["h-ipa-5","Ipamorelin","hormone","5mg*10vials",39,"lyo",0,"Ipamorelin is a synthetic pentapeptide and selective growth-hormone secretagogue that acts as a ghrelin-receptor (GHS-R1a) agonist. Unlike older GHRPs it is studied for more selective GH release with minimal effect on cortisol, prolactin or appetite in research models, making it a preferred tool in GH-axis studies. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","伊帕瑞林（Ipamorelin）是合成五肽，选择性生长激素促分泌剂，作为饥饿素受体（GHS-R1a）激动剂。与早期 GHRP 不同，研究模型中它被研究具有更选择性的 GH 释放，对皮质醇、催乳素或食欲影响很小，是 GH 轴研究的优选工具。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["h-cjcw-5","CJC1295 with DAC","hormone","5mg*10vials",149,"lyo",0,"CJC-1295 with DAC is a long-acting GHRH analogue carrying a Drug Affinity Complex (DAC) that covalently binds serum albumin, extending its half-life to several days. It is studied for sustained growth-hormone release and GH/IGF-1 axis research. The 'with DAC' form is distinguished from the shorter-acting 'no DAC' (mod GRF 1-29) variant. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","CJC-1295 with DAC 是带药物亲和复合物（DAC）的长效 GHRH 类似物，DAC 与血清白蛋白共价结合，将半衰期延长至数天，被研究用于持续生长激素释放与 GH/IGF-1 轴研究。“含 DAC”型区别于作用较短的“无 DAC”（mod GRF 1-29）变体。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],
 ["h-cjcw-10","CJC1295 with DAC","hormone","10mg*10vials",329,"lyo",0,"CJC-1295 with DAC is a long-acting GHRH analogue carrying a Drug Affinity Complex (DAC) that covalently binds serum albumin, extending its half-life to several days. It is studied for sustained growth-hormone release and GH/IGF-1 axis research. The 'with DAC' form is distinguished from the shorter-acting 'no DAC' (mod GRF 1-29) variant. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","CJC-1295 with DAC 是带药物亲和复合物（DAC）的长效 GHRH 类似物，DAC 与血清白蛋白共价结合，将半衰期延长至数天，被研究用于持续生长激素释放与 GH/IGF-1 轴研究。“含 DAC”型区别于作用较短的“无 DAC”（mod GRF 1-29）变体。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],
 ["h-cjcn-5","CJC1295 no DAC","hormone","5mg*10vials",82,"lyo",0,"CJC-1295 no DAC (also known as mod GRF 1-29) is a GHRH analogue modified for stability without the albumin-binding Drug Affinity Complex. It produces shorter, more pulsatile growth-hormone release in research models and is frequently studied in combination with a ghrelin-receptor agonist such as ipamorelin. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","CJC-1295 no DAC（又称 mod GRF 1-29）是经稳定性修饰但不含白蛋白结合药物亲和复合物（DAC）的 GHRH 类似物，研究模型中产生更短、更脉冲式的生长激素释放，常与伊帕瑞林等饥饿素受体激动剂联合研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["h-kiss-5","Kisspeptin-10","hormone","5mg*10vials",65,"lyo",0,"Kisspeptin-10 is the minimal active decapeptide fragment of the kisspeptin family, acting as the endogenous ligand of the KISS1R (GPR54) receptor. It is studied for its central role in the hypothalamic regulation of GnRH and the reproductive-hormone cascade, making it a key tool in reproductive endocrinology research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","Kisspeptin-10 是 kisspeptin 家族最小活性十肽片段，作为 KISS1R（GPR54）受体的内源配体，被研究在下丘脑 GnRH 与生殖激素级联调控中的核心作用，是生殖内分泌研究的关键工具。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["i-thy-10","Thymalin / Thymulin","immune","10mg*10vials",79,"lyo",0,"Thymalin/Thymulin refers to thymic peptide preparations studied for immune-system regulation. Thymulin is a zinc-dependent nonapeptide produced by thymic epithelial cells, and thymalin is a thymic peptide extract; both are investigated for effects on T-cell maturation, immune modulation and endocrine-immune interactions. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","Thymalin/Thymulin 是用于免疫系统调节研究的胸腺肽类制剂。Thymulin 是由胸腺上皮细胞产生、依赖锌的九肽；Thymalin 是胸腺肽提取物。二者被研究对 T 细胞成熟、免疫调节与内分泌-免疫互作的作用。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],
 ["i-ta1-5","Thymosin alpha 1","immune","5mg*10vials",89,"lyo",0,"Thymosin alpha 1 (Tα1) is a 28-amino-acid peptide originally isolated from thymosin fraction 5. It is studied for its immunomodulatory activity, including effects on T-cell maturation, dendritic-cell function, natural-killer-cell activity and cytokine regulation, and is widely used in immunology research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","胸腺素 α1（Tα1）是自胸腺素组分 5 中分离的 28 氨基酸肽，被研究具有免疫调节活性，包括对 T 细胞成熟、树突状细胞功能、自然杀伤细胞活性与细胞因子调节的影响，广泛用于免疫学研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["i-kpv-5","KPV","immune","5mg*10vials",42,"lyo",0,"KPV (Lys-Pro-Val) is a synthetic tripeptide corresponding to the C-terminal fragment of alpha-melanocyte-stimulating hormone (α-MSH). It is studied for anti-inflammatory and immunomodulatory activity, particularly in gut, skin and mucosal models, and is often used in inflammation research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C and reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","KPV（Lys-Pro-Val）是 α-黑素细胞刺激素（α-MSH）C 端片段的合成三肽，被研究具有抗炎与免疫调节活性，尤其在肠道、皮肤与黏膜模型中，常用于炎症研究。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

 ["i-vip-5","VIP","immune","5mg*10vials",139,"lyo",0,"VIP (Vasoactive Intestinal Peptide) is a 28-amino-acid neuropeptide of the secretin/glucagon family, widely distributed in the nervous system and gut. It is studied for vasodilation, smooth-muscle relaxation, immune modulation and neuroendocrine signalling, and is a key tool in vascular, gastrointestinal and immunology research. Supplied as a sterile lyophilized powder, ≥98% purity, 10 vials per box. Reconstitute with bacteriostatic water or 0.9% saline, swirl gently. Store lyophilized at −20 °C; reconstituted at 2–8 °C, protected from light. For research use only. Not for human or animal consumption.","VIP（血管活性肠肽）是促胰液素/胰高血糖素家族的 28 氨基酸神经肽，广泛分布于神经系统与肠道，被研究具有血管舒张、平滑肌松弛、免疫调节与神经内分泌信号作用，是血管、胃肠与免疫研究的关键工具。产品为无菌冻干粉末，纯度 ≥98%，每盒 10 瓶。用抑菌水或 0.9% 生理盐水轻柔旋转复溶；冻干粉 −20 °C、复溶液 2–8 °C 避光保存。仅供研究使用，不可用于人或动物摄入。"],

const CATS=[["weight"],["recovery"],["beauty"],["neuro"],["hormone"],["immune"],["combo"],["solvent"],["other"]];
const byId=Object.fromEntries(P.map(p=>[p[0],p]));
let lang=localStorage.getItem("pep_lang")||"en";
let activeCat="all";
let cart=JSON.parse(localStorage.getItem("pep_cart")||"{}");

const T=()=>I18N[lang];
const desc=p=> lang==="zh"? p[8] : p[7]; // es falls back to en
const $=id=>document.getElementById(id);

// ---- language switcher ----
const langSel=$("lang");
langSel.innerHTML=LANGS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
langSel.value=lang;
langSel.onchange=()=>{lang=langSel.value;localStorage.setItem("pep_lang",lang);applyStatic();render();renderCart();};

function applyStatic(){
  const t=T();
  document.documentElement.lang=lang;
  $("slogan").textContent=t.slogan;
  $("q").placeholder=t.search_ph;
  $("cartTitle").textContent=t.cart;
  document.documentElement.dir = (lang==="ar"?"rtl":"ltr");
  $("subLabel").textContent=t.subtotal;
  $("totLabel").textContent=t.total;
  $("checkout").textContent=t.checkout;
  $("disclaimer").textContent=t.disclaimer;
  $("empty").textContent=t.empty_cart;
  buildPills();
}

function buildPills(){
  const t=T();
  const all=[["all",t.all+" ("+P.length+")"]].concat(CATS.map(([k])=>[k,t.cat[k]+" ("+P.filter(p=>p[2]===k).length+")"]));
  $("pills").innerHTML=all.map(([k,l])=>`<button class="pill${k===activeCat?' active':''}" data-k="${k}">${l}</button>`).join("");
  $("pills").querySelectorAll(".pill").forEach(b=>b.onclick=()=>{activeCat=b.dataset.k;buildPills();render();});
}

function matches(p,term){
  if(!term) return true;
  term=term.toLowerCase();
  const hay=(p[1]+" "+p[3]+" "+T().cat[p[2]]).toLowerCase();
  return hay.includes(term);
}

function render(){
  const t=T(), term=$("q").value.trim();
  let shown=0, html="";
  const list=activeCat==="all"?CATS.map(c=>c[0]):[activeCat];
  for(const k of list){
    const items=P.filter(p=>p[2]===k && matches(p,term));
    if(!items.length) continue;
    shown+=items.length;
    html+=`<div class="cat"><h2>${t.cat[k]}</h2><div class="bar"></div><div class="num">${items.length}</div></div>`;
    html+=`<div class="grid">`+items.map(p=>{
      const[id,name,cat,spec,price,form,oos,den,dzh]=p;
      const formTxt=form==="liq"?t.liquid:t.lyophilized;
      const badges=`<span class="badge${form==='liq'?' liq':''}">${formTxt}</span>`+(oos?`<span class="badge oos">${t.oos}</span>`:"");
      const addBtn=oos?`<button class="btn add" disabled>${t.oos}</button>`:`<button class="btn add" onclick="addToCart('${id}')">${t.add}</button>`;
      return `<div class="card">
        <div class="name">${name}</div>
        <div class="spec">${spec}</div>
        <div class="desc">${desc(p)}</div>
        <div class="badges">${badges}</div>
        <div class="meta"><div class="price">$${price}<small>/ box</small></div></div>
        <div class="row">
          <button class="btn ghost" onclick="openModal('${id}')">${t.details}</button>
          ${addBtn}
        </div>
      </div>`;
    }).join("")+`</div>`;
  }
  $("catalog").innerHTML=html;
  $("empty").style.display=shown?"none":"block";
  $("count").textContent=t.count(shown,P.length);
}

// ---- cart ----
function addToCart(id){ cart[id]=(cart[id]||0)+1; saveCart(); renderCart(); flash(); }
function setQty(id,q){ if(q<=0) delete cart[id]; else cart[id]=q; saveCart(); renderCart(); }
function saveCart(){ localStorage.setItem("pep_cart",JSON.stringify(cart)); }
function flash(){ const b=$("cartBadge"); b.style.transform="scale(1.4)"; setTimeout(()=>b.style.transform="",150); }

function renderCart(){
  const t=T();
  const ids=Object.keys(cart);
  let sub=0;
  $("citems").innerHTML = ids.length? ids.map(id=>{
    const p=byId[id], q=cart[id], line=p[4]*q; sub+=line;
    return `<div class="citem">
      <div style="flex:1">
        <div class="ci-name">${p[1]}</div>
        <div class="ci-spec">${p[3]}</div>
        <div class="stepper">
          <button onclick="setQty('${id}',${q-1})">−</button>
          <span class="q">${q}</span>
          <button onclick="setQty('${id}',${q+1})">+</button>
          <span class="ci-price">$${line}</span>
        </div>
      </div>
      <button class="ci-rm" onclick="setQty('${id}',0)">${t.remove}</button>
    </div>`;
  }).join("") : `<div style="padding:24px 6px;color:var(--muted)">${t.empty_cart}</div>`;
  $("subVal").textContent="$"+sub;
  $("totVal").textContent="$"+sub;
  $("checkout").disabled=!ids.length;
  const n=ids.reduce((a,id)=>a+cart[id],0);
  const badge=$("cartBadge");
  if(n){ badge.style.display="flex"; badge.textContent=n; } else { badge.style.display="none"; }
}

$("cartOpen").onclick=()=>{ $("drawer").classList.add("show"); $("overlay").classList.add("show"); };
$("cartClose").onclick=closeCart;
$("overlay").onclick=closeCart;
function closeCart(){ $("drawer").classList.remove("show"); $("overlay").classList.remove("show"); }
$("checkout").onclick=()=>{
  const ids=Object.keys(cart); if(!ids.length) return;
  const L={en:["ORDER","Total"],zh:["订单信息","合计"],es:["PEDIDO","Total"],ru:["ЗАКАЗ","Итого"],ja:["ご注文","合計"],ko:["주문","합계"],ar:["الطلب","الإجمالي"]};
  const lbl=L[lang]||L.en;
  let total=0, lines=[];
  lines.push("PeptideExpress — "+lbl[0]);
  lines.push("--------------------------------");
  ids.forEach(id=>{ const p=byId[id],q=cart[id],line=p[4]*q; total+=line;
    lines.push(p[1]+" | "+p[3]+" | $"+p[4]+" x"+q+" = $"+line); });
  lines.push("--------------------------------");
  lines.push(lbl[1]+": $"+total);
  const text=lines.join("\n");
  const btn=$("checkout"), orig=T().checkout;
  const done=()=>{ btn.textContent=(lang==="zh"?"已复制 ✓":"Copied! ✓"); setTimeout(()=>{ btn.textContent=T().checkout; },1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{
      const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta); done();
    });
  } else {
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta); done();
  }
};

// ---- modal ----
let modalId=null;
function openModal(id){ modalId=id; const t=T(),p=byId[id];
  $("mName").textContent=p[1];
  $("mSpec").textContent=p[3]+"  ·  "+(p[5]==="liq"?t.liquid:t.lyophilized);
  $("mDesc").textContent=desc(p);
  $("mNote").textContent=t.detail_note;
  $("mPrice").textContent="$"+p[4]+" / box";
  const addBtn=$("mAdd");
  if(p[6]){ addBtn.disabled=true; addBtn.textContent=t.oos; } else { addBtn.disabled=false; addBtn.textContent=t.add; addBtn.onclick=()=>{ addToCart(id); }; }
  $("modal").classList.add("show");
}
$("mClose").onclick=()=>$("modal").classList.remove("show");
$("modal").onclick=e=>{ if(e.target===$("modal")) $("modal").classList.remove("show"); };

$("q").addEventListener("input",render);
applyStatic(); render(); renderCart();
</script>
</body>
</html>
